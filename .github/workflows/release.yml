name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npm
        id: publish
        if: steps.changesets.outputs['has-changesets'] == 'false'
        env:
          NPM_PUBLISH_CLI: npm@11.18.0
        run: |
          # Each package has its own release tag: core keeps v<version>, the
          # others use <package-name>@<version>. Only packages whose version
          # is not on npm yet are verified, published, and tagged.
          workspaces=()
          tags=()
          plan() {
            local workspace="$1" directory="$2" tag_prefix="$3"
            local version npm_version
            version=$(node -p "require('./packages/$directory/package.json').version")
            npm_version=$(npm view "$workspace" version 2>/dev/null || echo "0.0.0")
            if [ "$version" != "$npm_version" ]; then
              echo "Will publish $workspace $version (npm has $npm_version)"
              workspaces+=("$workspace")
              tags+=("$tag_prefix$version")
            else
              echo "$workspace $version already published, skipping"
            fi
          }
          plan eslint-plugin-llm-core eslint-plugin v
          plan eslint-plugin-llm-core-mcp mcp-server eslint-plugin-llm-core-mcp@
          plan llm-core-quality quality-cli llm-core-quality@
          # Verify every needed tag before the first publish, so a mismatch on
          # one package publishes nothing.
          for tag in "${tags[@]}"; do
            bash .github/scripts/release-tag.sh "$tag" "$GITHUB_SHA" --verify-only
          done
          for workspace in "${workspaces[@]}"; do
            npx -y "$NPM_PUBLISH_CLI" publish --workspace "$workspace" --access public --provenance
          done
          echo "tags=${tags[*]}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        if: steps.publish.outputs.tags != ''
        run: |
          for tag in $RELEASE_TAGS; do
            bash .github/scripts/release-tag.sh "$tag" "$GITHUB_SHA" --verify-only
          done
          for tag in $RELEASE_TAGS; do
            case "$tag" in
              # Core releases keep GitHub's "Latest" marker.
              v*) bash .github/scripts/release-tag.sh "$tag" "$GITHUB_SHA" ;;
              *) bash .github/scripts/release-tag.sh "$tag" "$GITHUB_SHA" --latest=false ;;
            esac
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAGS: ${{ steps.publish.outputs.tags }}
