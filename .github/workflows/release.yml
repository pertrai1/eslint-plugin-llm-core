name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npm
        id: publish
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          NPM_PUBLISH_CLI: npm@11.18.0
        run: |
          CURRENT_VERSION=$(node -p "require('./packages/eslint-plugin/package.json').version")
          MCP_VERSION=$(node -p "require('./packages/mcp-server/package.json').version")
          NPM_VERSION=$(npm view eslint-plugin-llm-core version 2>/dev/null || echo "0.0.0")
          MCP_NPM_VERSION=$(npm view eslint-plugin-llm-core-mcp version 2>/dev/null || echo "0.0.0")
          published=false
          if [ "$CURRENT_VERSION" != "$NPM_VERSION" ]; then
            echo "Publishing $CURRENT_VERSION (npm has $NPM_VERSION)"
            npx -y "$NPM_PUBLISH_CLI" publish --workspace eslint-plugin-llm-core --access public --provenance
            published=true
          else
            echo "Core version $CURRENT_VERSION already published, skipping"
          fi
          if [ "$MCP_VERSION" != "$MCP_NPM_VERSION" ]; then
            echo "Publishing MCP $MCP_VERSION (npm has $MCP_NPM_VERSION)"
            npx -y "$NPM_PUBLISH_CLI" publish --workspace eslint-plugin-llm-core-mcp --access public --provenance
            published=true
          else
            echo "MCP version $MCP_VERSION already published, skipping"
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true'
        run: |
          tag="v${{ steps.publish.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping"
          else
            gh release create "$tag" --generate-notes
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
